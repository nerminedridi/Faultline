global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: shop
    static_configs:
      - targets: [gateway:8000, orders:8000, inventory:8000, payments:8000]
    relabel_configs:
      # "orders:8000" -> service="orders"
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
